name: Sync arena.ai data

# Pulls the Code Arena WebDev leaderboards and commits `data/` only when it
# changed. The push triggers a Vercel production deploy; unchanged runs cost
# no build minutes.
on:
  schedule:
    - cron: "17 6,10,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-arena
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch leaderboards
        run: node scripts/fetch-arena.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- data; then
            echo "No changes."
            exit 0
          fi
          cutoff=$(node -p "require('./data/leaderboards/overall.json').voteCutoff?.slice(0, 10) ?? ''")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): sync arena.ai snapshot ${cutoff}"
          git push
